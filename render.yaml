# Blueprint Agilzi — API (Node + SQLite em disco) + frontend estático.
# Uso: Render Dashboard → New → Blueprint → conecte este repositório.
# NOTA: plano Free (teste) — sem disco persistente: o banco SQLite
# é recriado a cada deploy/sleep. Para produção, volte ao plano
# Starter + bloco `disk` abaixo.
services:
  - type: web
    name: agilzi-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    # --include=dev: o Render instala só `dependencies` por padrão, mas o
    # build (tsc) precisa de typescript + @types/* que estão em devDependencies
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      # Ajuste após o primeiro deploy para a URL do frontend:
      - key: FRONTEND_URL
        value: https://agilzi-web.onrender.com

  - type: web
    name: agilzi-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # O frontend chama a API em /api/* (relativo) — repasse ao serviço da API.
      # Ajuste o destino para a URL real do agilzi-api após o primeiro deploy.
      - type: rewrite
        source: /api/*
        destination: https://agilzi-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
